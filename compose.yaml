services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-regrove}
      POSTGRES_USER: ${POSTGRES_USER:-regrove}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-regrove_local}
    ports:
      - "${REGROVE_DB_PORT:-5433}:5432"
    volumes:
      - regrove_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-regrove} -d ${POSTGRES_DB:-regrove}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  regrove_postgres_data:
